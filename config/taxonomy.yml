# What HackHarbor covers, and how a video is matched to it.
#
# Every category has topics. "terms" are phrases looked for in a video's title,
# tags, chapters and description. The title counts most. Numbers are weights;
# a negative weight pushes a video away from that category.
#
# "search" lists YouTube searches the pipeline rotates through to find new
# videos and new channels for that topic.
#
# Age rules per category decide what an older video has to prove:
#   fresh_months       newer than this, a video is judged as new
#   classic_max_years  older videos are considered up to this age...
#   classic_min_score  ...and only kept if they're evergreen and score this high
#
# requires_security_context: the video (or its channel) must also be clearly
# about security. Used for Fundamentals, where words like "linux" or "http"
# match a lot of general programming videos.

