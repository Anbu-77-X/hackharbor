# Starting channels. The pipeline finds more on its own (see docs/LOGIC.md);
# this list is only the seed, and it doesn't have to be complete.
#
# Give a channel by "id" (UC...) or "handle" (@name). Handles are looked up once
# and the id is kept. If a handle is wrong, the pipeline tries the name instead
# and lists anything it couldn't find in the run report.
#
# tier
#   core     trusted: new videos skip the waiting period and get a reputation boost
#   watched  checked every few hours; videos are judged like any other
#   broad    big channels only partly about security; only clearly relevant videos pass
# kind       creator | conference | university | company | podcast
#            (sets the default video type: conference -> talk, university -> lecture)
# cats       categories the channel usually covers (a hint, not a rule)

