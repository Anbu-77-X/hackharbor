name: pipeline

on:
  schedule:
    - cron: "17 */2 * * *"   # every two hours, at :17 to stay clear of the top-of-the-hour rush
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write    # save the pipeline's memory to the "state" branch
      actions: write     # keep this schedule switched on
    steps:
      # Actions are pinned to exact commits, so a moved tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # the token isn't left on disk while the pipeline runs

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install --require-hashes --no-deps -r requirements.txt

      - name: Restore memory
        run: |
          mkdir -p state
          if git fetch --depth=1 origin state 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C state
            if [ -f state/harbor.db.gz ]; then gunzip -f state/harbor.db.gz; fi
          fi

      - name: Find, judge and publish videos
        id: run
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            python -m pipeline.run --config config --state state --site site --out _site
          else
            echo "::warning::YOUTUBE_API_KEY isn't set yet, so this run publishes the small sample. Add the secret to start the real pipeline."
            python -m pipeline.run --offline fixtures/sample --state _sample_state --site site --out _site
          fi

      - name: Save memory
        if: always()
        run: |
          [ -f state/harbor.db ] || exit 0
          mkdir -p _state
          gzip -9 -c state/harbor.db > _state/harbor.db.gz
          [ -f state/report.json ] && cp state/report.json _state/
          cd _state
          git init -q -b state
          git config user.name "hackharbor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "state $(date -u +%Y-%m-%dT%H:%MZ)"
          # The token goes in a header for this one command, never into a URL or a config file.
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" state
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        if: always() && hashFiles('_site/index.html') != ''
        with:
          path: _site

      - name: Keep the schedule switched on
        if: always()
        run: gh workflow enable pipeline.yml --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail if this run was unhealthy (GitHub emails you)
        if: steps.run.outcome == 'failure'
        run: |
          echo "See the run log, and state/report.json on the state branch."
          exit 1

  deploy:
    needs: run
    if: always() && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write       # publish the site
      id-token: write    # prove to Pages that this run is this repository's
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
